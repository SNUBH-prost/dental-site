# Firestore 보안 규칙 배포
#
# firestore.rules 는 저장소에 있어도 그 자체로는 아무 효력이 없습니다.
# Firebase 프로젝트에 "게시"되어야 적용됩니다. 이 워크플로는 규칙 파일이
# main 에 반영될 때 자동으로 게시합니다.
#
# 사용하려면 저장소 Secrets 에 서비스 계정 키를 등록해야 합니다.
#   1. Firebase 콘솔 → 프로젝트 설정 → 서비스 계정 → 새 비공개 키 생성
#   2. 내려받은 JSON 전체를 GitHub → Settings → Secrets and variables →
#      Actions → New repository secret 에 FIREBASE_SERVICE_ACCOUNT 로 저장
#
# 등록 전까지는 이 워크플로가 실패하며, 그 동안은 콘솔에서 직접 게시하면 됩니다.

name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Write service account credentials
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Deploy rules
        run: firebase deploy --only firestore:rules --project dental-clinical-5c291 --non-interactive
